services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: contest
      POSTGRES_DB: contest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contest -d contest"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://contest:${POSTGRES_PASSWORD}@db:5432/contest
    command: ["npm", "run", "db:migrate"]
    depends_on:
      db:
        condition: service_healthy
  app:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://contest:${POSTGRES_PASSWORD}@db:5432/contest
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://contest:${POSTGRES_PASSWORD}@db:5432/contest
    command: ["npm", "run", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
volumes:
  database:
